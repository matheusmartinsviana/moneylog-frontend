<app-page-layout [heading]="t().nav.planning">
  <div class="stack">
    <app-planning-nav current="income" />

    <div class="stack">
      <div class="toolbar">
        <app-segmented-toggle
          cy="income-status"
          [label]="t().income.statusLabel"
          [options]="statusOptions()"
          [value]="profiles.filter()"
          (valueChange)="setStatus($event)"
        />
        <button
          type="button"
          class="button button--primary"
          data-cy="income-add"
          (click)="openCreate()"
        >
          {{ t().income.add }}
        </button>
      </div>

      @if (archiveError(); as message) {
        <p class="banner" role="alert" data-cy="income-action-error">{{ message }}</p>
      }

      @switch (profiles.state().status) {
        @case ('loading') {
          <div data-cy="income-loading">
            <p class="visually-hidden" role="status">{{ t().income.loading }}</p>
            <div class="list-skeleton" aria-hidden="true">
              <div class="list-skeleton__row"></div>
              <div class="list-skeleton__row"></div>
              <div class="list-skeleton__row"></div>
            </div>
          </div>
        }
        @case ('error') {
          <app-error-state [problem]="profiles.error()" (retry)="retry()" />
        }
        @case ('empty') {
          <app-empty-state
            [heading]="t().income.empty.title"
            [description]="
              profiles.filter() === 'ACTIVE'
                ? t().income.empty.description
                : t().income.emptyArchived
            "
            [actions]="emptyActions()"
            illustration="grid"
            (action)="openCreate()"
          />
        }
        @case ('ready') {
          <div class="layout">
            <ul class="list" data-cy="income-list">
              @for (profile of profiles.data(); track profile.id) {
                <li
                  app-income-profile-card
                  [profile]="profile"
                  [selected]="selected()?.id === profile.id"
                  [busy]="profiles.archiving()"
                  (previewRequested)="select($event)"
                  (editRequested)="openEdit($event)"
                  (archiveRequested)="askArchive($event)"
                ></li>
              }
            </ul>
            <app-income-preview-panel [profile]="selected()" />
          </div>
        }
      }

      <app-disclosure fieldId="income-tax-tables" [heading]="t().brief.more" [headingLevel]="2">
        <app-tax-tables-panel />
      </app-disclosure>
    </div>
  </div>

  @if (formOpen()) {
    <app-income-form-modal [profile]="editing()" (closed)="closeForm()" (saved)="afterSaved()" />
  }
  <app-confirm-dialog
    [open]="archiving() !== null"
    [heading]="t().income.profile.archiveTitle"
    [description]="t().income.profile.archiveDescription"
    [confirmLabel]="t().income.profile.archiveConfirm"
    [cancelLabel]="t().income.profile.cancel"
    [busy]="profiles.archiving()"
    (confirmed)="confirmArchive()"
    (cancelled)="archiving.set(null)"
  />
</app-page-layout>
