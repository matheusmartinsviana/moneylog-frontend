<app-page-layout reading [heading]="t().nav.settings">
  <div class="page-grid settings">
    <app-profile-section class="span-12" />

    <app-section-container class="span-7" [heading]="t().settings.preferences">
      <div class="preferences">
        <app-select
          [formControl]="languageControl"
          fieldId="settings-language"
          [label]="t().settings.language"
          [options]="languageOptions()"
        />
        <app-select
          [formControl]="themeControl"
          fieldId="settings-theme"
          [label]="t().settings.theme"
          [options]="themeOptions()"
        />
      </div>
    </app-section-container>

    <nav class="links card-flat span-5" [attr.aria-label]="t().brief.settingsLinks">
      <a class="links__row" routerLink="/settings/categories" data-cy="settings-categories-link">
        <span>{{ t().categories.settingsLink }}</span>
        <app-icon name="chevronRight" [size]="18" />
      </a>
      <a
        class="links__row"
        routerLink="/settings/notifications"
        data-cy="settings-notifications-link"
      >
        <span>{{ t().notifications.settings.title }}</span>
        <app-icon name="chevronRight" [size]="18" />
      </a>
      <a class="links__row" routerLink="/settings/shortcuts" data-cy="settings-shortcuts-link">
        <span>{{ t().quickEntry.settingsLink }}</span>
        <app-icon name="chevronRight" [size]="18" />
      </a>
      @if (isOwner()) {
        <a class="links__row" routerLink="/ai" data-cy="settings-ai-link">
          <span>{{ t().nav.ai }}</span>
          <app-icon name="chevronRight" [size]="18" />
        </a>
      }
      @if (isOwner()) {
        <a class="links__row" routerLink="/users" data-cy="settings-users-link">
          <span>{{ t().access.users.settingsLink }}</span>
          <app-icon name="chevronRight" [size]="18" />
        </a>
      }
      <a class="links__row" routerLink="/vault" data-cy="settings-vault-link">
        <span>{{ t().workspacePages.vault.cardTitle }}</span>
        <app-icon name="chevronRight" [size]="18" />
      </a>
    </nav>

    <app-disclosure
      class="settings__more span-12"
      fieldId="settings-more"
      [heading]="t().brief.more"
      [headingLevel]="2"
    >
      <div class="settings__more-body">
        <app-export-section />
        <app-vault-section />
        <app-empty-state
          [heading]="t().emptyState.settings.title"
          [description]="t().emptyState.settings.description"
          [actions]="actions()"
          illustration="document"
        />
      </div>
    </app-disclosure>

    <div class="quiet-actions span-12">
      <button
        type="button"
        class="button"
        data-cy="settings-sign-out"
        [disabled]="signingOut()"
        (click)="signOut()"
      >
        {{ signingOut() ? t().auth.session.signingOut : t().auth.session.signOut }}
      </button>
    </div>
  </div>
</app-page-layout>
