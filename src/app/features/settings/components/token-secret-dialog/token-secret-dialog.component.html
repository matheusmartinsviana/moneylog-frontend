<app-dialog
  [open]="secret() !== null"
  [heading]="t().quickEntry.secret.title"
  [description]="t().quickEntry.secret.description"
  [dismissable]="false"
  [showClose]="false"
  cy="token-secret-dialog"
>
  @if (secret(); as current) {
    <div class="secret">
      <p class="secret__label" id="token-secret-label">{{ tokenLabel() }}</p>
      <code class="secret__value" aria-labelledby="token-secret-label" data-cy="token-secret">{{
        current.value
      }}</code>
      <p class="secret__warning" data-cy="token-secret-warning">
        {{ t().quickEntry.secret.warning }}
      </p>
      <div class="secret__actions">
        <button type="button" class="button button--primary" data-cy="token-copy" (click)="copy()">
          {{ t().quickEntry.secret.copy }}
        </button>
        <button type="button" class="button" data-cy="token-secret-close" (click)="close()">
          {{ t().quickEntry.secret.close }}
        </button>
      </div>
      <div role="status" aria-live="polite">
        @if (copyState() === 'copied') {
          <p class="secret__feedback" data-cy="token-copy-feedback">
            {{ t().quickEntry.secret.copied }}
          </p>
        } @else if (copyState() === 'failed') {
          <p class="secret__feedback secret__feedback--risk" data-cy="token-copy-failed">
            {{ t().quickEntry.secret.copyFailed }}
          </p>
        }
      </div>
    </div>
  }
</app-dialog>
