<app-glass-panel class="pomodoro" variant="card" [flat]="true" data-cy="home-pomodoro">
  <div class="pomodoro__body">
    <header class="pomodoro__head">
      <button
        type="button"
        class="icon-button pomodoro__focus-open"
        data-cy="home-pomodoro-focus-open"
        [attr.aria-label]="t().home.pomodoro.focusMode"
        [attr.aria-haspopup]="'dialog'"
        (click)="focusOpen.set(true)"
      >
        <app-icon name="expand" [size]="18" />
      </button>
      <p class="pomodoro__greeting" data-cy="home-pomodoro-greeting">{{ greeting() }}</p>
      <p class="pomodoro__phrase">{{ pomodoro.phrase() }}</p>
    </header>

    <div class="pomodoro__modes" role="group" [attr.aria-label]="t().home.pomodoro.modes">
      @for (item of pomodoro.modes; track item) {
        <button
          type="button"
          class="pomodoro__chip hit"
          [attr.aria-pressed]="pomodoro.mode() === item"
          [attr.data-cy]="'home-pomodoro-mode-' + item"
          (click)="pomodoro.selectMode(item)"
        >
          {{ pomodoro.modeLabel(item) }}
        </button>
      }
    </div>

    <div
      class="pomodoro__display"
      role="timer"
      data-cy="home-pomodoro-timer"
      [attr.aria-label]="pomodoro.timerLabel()"
    >
      <app-pomodoro-clock [digits]="pomodoro.digits()" />
    </div>

    <div class="pomodoro__controls">
      <button
        type="button"
        class="button pomodoro__main"
        data-cy="home-pomodoro-toggle"
        (click)="pomodoro.toggle()"
      >
        {{ pomodoro.mainLabel() }}
      </button>
      <div class="pomodoro__side">
        <span class="pomodoro__stop-label" aria-hidden="true">{{ t().home.pomodoro.stop }}</span>
        <button
          type="button"
          class="icon-button pomodoro__stop"
          data-cy="home-pomodoro-stop"
          [attr.aria-label]="t().home.pomodoro.stopLabel"
          (click)="pomodoro.stop()"
        >
          <span class="pomodoro__stop-mark"></span>
        </button>
      </div>
    </div>

    <p
      class="pomodoro__dots"
      role="img"
      data-cy="home-pomodoro-cycles"
      [attr.aria-label]="pomodoro.cyclesLabel()"
    >
      @for (dot of pomodoro.dots; track dot) {
        <span class="pomodoro__dot" [class.pomodoro__dot--on]="dot < pomodoro.filledDots()"></span>
      }
    </p>

    @if (!focusOpen()) {
      <p class="visually-hidden" role="status" aria-live="polite" data-cy="home-pomodoro-live">
        {{ pomodoro.announcement() }}
      </p>
    }
  </div>
</app-glass-panel>

<app-pomodoro-focus [open]="focusOpen()" (closed)="focusOpen.set(false)" />
