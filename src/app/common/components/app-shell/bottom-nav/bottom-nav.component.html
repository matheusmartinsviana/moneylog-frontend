<nav
  class="bottom-nav glass-rail glass-rail--bar"
  [attr.aria-label]="t().shell.bottomNavigation"
  data-cy="bottom-nav"
>
  <ul class="bottom-nav__list">
    @for (item of items; track item.key) {
      <li class="bottom-nav__item">
        <a
          class="bottom-nav__link"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="item.activeOptions"
          ariaCurrentWhenActive="page"
          [attr.data-cy]="'bottom-nav-' + item.key"
        >
          <span class="bottom-nav__sq"><app-icon [name]="item.icon" [size]="20" /></span>
          <span class="bottom-nav__label">
            @let label = labelOf(item.key);
            @if (label.short === label.label) {
              {{ label.label }}
            } @else {
              <span class="bottom-nav__label-full">{{ label.label }}</span>
              <span class="bottom-nav__label-short">{{ label.short }}</span>
            }
          </span>
        </a>
      </li>
    }
  </ul>
</nav>
