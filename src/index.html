<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <script>
      try {
        var t = localStorage.getItem('moneylog.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <title>moneylog</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f1f2ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1d15" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="moneylog" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="moneylog" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="assets/icons/favicon.ico?v=5" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png?v=5" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16.png?v=5" />
    <link rel="icon" type="image/png" sizes="48x48" href="assets/icons/icon-48.png?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png?v=5" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
